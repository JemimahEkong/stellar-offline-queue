name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Gated testnet integration job. Runs only when the repository variable
  # STELLAR_TESTNET is set to "1" (or on manual dispatch); it never blocks
  # unit CI. The integration suite itself is delivered by Phase 18.
  integration:
    name: Integration (testnet, gated)
    runs-on: ubuntu-latest
    needs: verify
    if: vars.STELLAR_TESTNET == '1' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Integration tests
        run: npm run test:integration
        env:
          STELLAR_TESTNET: '1'
